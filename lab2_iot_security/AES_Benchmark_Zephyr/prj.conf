# Settings shared by every variant.
# The AES implementation itself is chosen by ONE overlay file:
#   sw_ram.conf, sw_rom.conf, sw_rom_fewer.conf or hw.conf

CONFIG_PRINTK=y
CONFIG_TIMING_FUNCTIONS=y      # cycle-accurate timer (Cortex-M4 DWT counter)
CONFIG_ENTROPY_GENERATOR=y     # STM32 hardware RNG
CONFIG_MAIN_STACK_SIZE=4096
